[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metabolic-pathway-engine"
version = "1.0.0"
description = "Interactive Systems-Biology & Precision Nutrition Platform — transforming raw personal genomic files into live metabolic network maps and personalized daily nutrition protocols."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "networkx>=3.2",
    "pyvis>=0.3.2",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"